{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - PrácticasPro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col font-sans text-gray-800">

  <!-- NAVBAR -->
  <header class="bg-blue-900 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="{% url 'index' %}" class="flex items-center space-x-2">
        <span class="text-2xl font-bold tracking-tight">Prácticas<span class="text-yellow-400">Pro</span></span>
      </a>
      <nav class="flex items-center space-x-4 text-xs sm:text-sm">
        <a href="{% url 'dashboard_estudiante' %}" class="text-blue-200 hover:text-white">Volver al Dashboard</a>
        <a href="{% url 'login_usuario' %}" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg transition font-medium">Cerrar Sesión</a>
      </nav>
    </div>
  </header>

  <main class="flex-grow max-w-4xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 sm:p-8 space-y-6">
      
      <h1 class="text-xl font-bold text-gray-900 border-b border-gray-100 pb-3">Mi Perfil Profesional</h1>

      <!-- FORMULARIO CONFIGURADO PARA SUBIDA DE ARCHIVOS -->
      <form method="POST" enctype="multipart/form-data" class="space-y-6 text-xs sm:text-sm">
        {% csrf_token %}

        <!-- FOTO DE PERFIL -->
        <div class="flex items-center space-x-4">
          <div class="w-20 h-20 rounded-full bg-blue-100 border-2 border-blue-900 flex items-center justify-center text-2xl font-bold text-blue-900">
            JP
          </div>
          <div>
            <label class="block font-semibold text-gray-700 mb-1">Foto de Perfil</label>
            <input type="file" name="foto_perfil" accept="image/*" class="text-xs text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-900 file:font-semibold hover:file:bg-blue-100">
          </div>
        </div>

        <!-- DATOS PERSONALES -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block font-semibold text-gray-700 mb-1">Nombre Completo</label>
            <input type="text" name="nombre" value="Juan Pérez" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-900 focus:outline-none">
          </div>
          <div>
            <label class="block font-semibold text-gray-700 mb-1">Correo Institucional</label>
            <input type="email" value="ju.perez@duocuc.cl" disabled class="w-full p-2.5 border rounded-lg bg-gray-50 text-gray-500">
          </div>
          <div>
            <label class="block font-semibold text-gray-700 mb-1">Carrera</label>
            <input type="text" name="carrera" value="Ingeniería en Informática" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-900 focus:outline-none">
          </div>
          <div>
            <label class="block font-semibold text-gray-700 mb-1">Sede Duoc UC</label>
            <input type="text" name="sede" value="Puente Alto" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-blue-900 focus:outline-none">
          </div>
        </div>

        <!-- SUBIDA DE CURRÍCULUM PDF -->
        <div class="border-t border-gray-100 pt-4 space-y-2">
          <label class="block font-semibold text-gray-700">Currículum Vitae (PDF)</label>
          <div class="border-2 border-dashed border-gray-300 p-4 rounded-xl text-center hover:border-blue-900 transition">
            <input type="file" name="cv_documento" accept=".pdf" class="w-full text-xs text-gray-500 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-blue-900 file:text-white file:font-semibold hover:file:bg-blue-800">
            <p class="text-[11px] text-gray-400 mt-2">Formatos permitidos: PDF (Máx. 5MB)</p>
          </div>
        </div>

        <div class="flex justify-end pt-4">
          <button type="submit" class="bg-blue-900 hover:bg-blue-800 text-white font-bold px-6 py-2.5 rounded-lg transition">Guardar Cambios</button>
        </div>
      </form>

    </div>
  </main>

  <footer class="bg-gray-900 text-gray-400 py-6 text-center text-xs border-t border-gray-800 mt-auto">
    <p>&copy; 2026 PrácticasPro — Duoc UC.</p>
  </footer>
</body>
</html>
