{% extends 'base.html' %}

{% block content %}
<!-- Cargamos Leaflet para el mini-mapa -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <div class="mb-6 flex items-center gap-4">
        <a href="{% url 'home_empresa' %}" class="text-gray-500 hover:text-gray-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </a>
        <h1 class="text-2xl font-bold text-gray-800">Crear Oferta de Práctica</h1>
    </div>

    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-gray-100">
        <form method="POST" action="{% url 'crear_oferta' %}">
            {% csrf_token %}
            
            <div class="space-y-6">
                <!-- Título -->
                <div>
                    <label for="titulo" class="block text-sm font-medium text-gray-700 mb-1">Título de la Práctica</label>
                    <input type="text" id="titulo" name="titulo" required placeholder="Ej: Desarrollador Frontend Trainee"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500">
                </div>

                <!-- Descripción y Requisitos (Igual que antes) -->
                <div>
                    <label for="descripcion" class="block text-sm font-medium text-gray-700 mb-1">Descripción y Funciones</label>
                    <textarea id="descripcion" name="descripcion" rows="4" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500"></textarea>
                </div>

                <div>
                    <label for="requisitos" class="block text-sm font-medium text-gray-700 mb-1">Requisitos</label>
                    <textarea id="requisitos" name="requisitos" rows="3" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500"></textarea>
                </div>

                <!-- Modalidad -->
                <div>
                    <label for="modalidad" class="block text-sm font-medium text-gray-700 mb-1">Modalidad de Trabajo</label>
                    <select id="modalidad" name="modalidad" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500">
                        <option value="Presencial">Presencial</option>
                        <option value="Remoto">Remoto</option>
                        <option value="Híbrido">Híbrido</option>
                    </select>
                </div>

                <!-- NUEVO: Selector de Ubicación -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Ubicación de la Práctica</label>
                    <p class="text-xs text-gray-500 mb-2">Haz clic en el mapa para marcar la ubicación exacta de tu empresa.</p>
                    
                    <!-- Campos ocultos para enviar a views.py -->
                    <input type="hidden" id="latitud" name="latitud" value="-33.4489">
                    <input type="hidden" id="longitud" name="longitud" value="-70.6693">
                    
                    <!-- Contenedor del mini mapa -->
                    <div id="mapa-crear" class="w-full h-64 rounded-lg border border-gray-300 z-10"></div>
                </div>

                <!-- Botón de Envío -->
                <div class="pt-4">
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-md">
                        Publicar Oferta
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Iniciar mapa en Santiago
        var map = L.map('mapa-crear').setView([-33.4489, -70.6693], 12);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Pin inicial (que se puede mover)
        var marker = L.marker([-33.4489, -70.6693], {draggable: true}).addTo(map);

        // Actualizar coordenadas si el usuario arrastra el pin
        marker.on('dragend', function(e) {
            var latLng = marker.getLatLng();
            document.getElementById('latitud').value = latLng.lat;
            document.getElementById('longitud').value = latLng.lng;
        });

        // Actualizar coordenadas si el usuario hace clic en otro lado del mapa
        map.on('click', function(e) {
            marker.setLatLng(e.latlng);
            document.getElementById('latitud').value = e.latlng.lat;
            document.getElementById('longitud').value = e.latlng.lng;
        });
    });
</script>
{% endblock %}
