{% extends 'base.html' %}

{% block content %}
<!-- Cargamos Leaflet para el mini-mapa -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <div class="mb-6 flex items-center gap-4">
        <a href="{% url 'home_empresa' %}" class="text-gray-500 hover:text-gray-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </a>
        <h1 class="text-2xl font-bold text-gray-800">Crear Oferta de Práctica</h1>
    </div>

    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-gray-100">
        <form method="POST" action="{% url 'crear_oferta' %}">
            {% csrf_token %}
            
            <div class="space-y-6">
                <!-- Título -->
                <div>
                    <label for="titulo" class="block text-sm font-medium text-gray-700 mb-1">Título de la Práctica</label>
                    <input type="text" id="titulo" name="titulo" required placeholder="Ej: Desarrollador Frontend Trainee"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500">
                </div>

                <!-- Descripción y Requisitos -->
                <div>
                    <label for="descripcion" class="block text-sm font-medium text-gray-700 mb-1">Descripción y Funciones</label>
                    <textarea id="descripcion" name="descripcion" rows="4" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500"></textarea>
                </div>

                <div>
                    <label for="requisitos" class="block text-sm font-medium text-gray-700 mb-1">Requisitos</label>
                    <textarea id="requisitos" name="requisitos" rows="3" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500"></textarea>
                </div>

                <!-- Modalidad -->
                <div>
                    <label for="modalidad" class="block text-sm font-medium text-gray-700 mb-1">Modalidad de Trabajo</label>
                    <select id="modalidad" name="modalidad" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500">
                        <option value="Presencial">Presencial</option>
                        <option value="Remoto">Remoto</option>
                        <option value="Híbrido">Híbrido</option>
                    </select>
                </div>

                <!-- NUEVO: Selector de Carreras -->
                <div>
                    <label for="carrera" class="block text-sm font-medium text-gray-700 mb-1">Carrera Orientada</label>
                    <select id="carrera" name="carrera" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-emerald-500 focus:border-emerald-500">
                        <option value="" disabled selected>Selecciona una carrera...</option>
                        <option value="Ingeniería en Construcción">Ingeniería en Construcción</option>
                        <option value="Ingeniería en Prevención de Riesgos">Ingeniería en Prevención de Riesgos</option>
                        <option value="Técnico en Construcción">Técnico en Construcción</option>
                        <option value="Ingeniería en Informática">Ingeniería en Informática</option>
                        <option value="Analista Programador">Analista Programador</option>
                        <option value="Ingeniería en Redes y Telecomunicaciones">Ingeniería en Redes y Telecomunicaciones</option>
                        <option value="Técnico en Desabolladura y Pintura Automotriz">Técnico en Desabolladura y Pintura Automotriz</option>
                        <option value="Técnico en Electricidad y Automatización Industrial">Técnico en Electricidad y Automatización Industrial</option>
                        <option value="Ingeniería en Electricidad y Automatización Industrial">Ingeniería en Electricidad y Automatización Industrial</option>
                        <option value="Ingeniería Agrícola">Ingeniería Agrícola</option>
                        <option value="Ingeniería en Mecánica Automotriz y Autotrónica">Ingeniería en Mecánica Automotriz y Autotrónica</option>
                        <option value="Técnico en Calidad de Alimentos">Técnico en Calidad de Alimentos</option>
                        <option value="Técnico Veterinario y Pecuario">Técnico Veterinario y Pecuario</option>
                        <option value="Técnico en Operación y Supervisión de Procesos Mineros">Técnico en Operación y Supervisión de Procesos Mineros</option>
                        <option value="Técnico en Mecánica Automotriz y Autotrónica">Técnico en Mecánica Automotriz y Autotrónica</option>
                        <option value="Técnico en Geología">Técnico en Geología</option>
                        <option value="Técnico en Laboratorio Clínico, Banco de Sangre e Imagenología">Técnico en Laboratorio Clínico, Banco de Sangre e Imagenología</option>
                        <option value="Preparador Físico">Preparador Físico</option>
                        <option value="Técnico en Enfermería">Técnico en Enfermería</option>
                        <option value="Técnico en Química y Farmacia">Técnico en Química y Farmacia</option>
                        <option value="Técnico en Odontología">Técnico en Odontología</option>
                        <option value="Ingeniería en Marketing Digital">Ingeniería en Marketing Digital</option>
                        <option value="Auditoría">Auditoría</option>
                        <option value="Ingeniería en Gestión Logística">Ingeniería en Gestión Logística</option>
                        <option value="Ingeniería en Comercio Exterior">Ingeniería en Comercio Exterior</option>
                        <option value="Ingeniería en Administración, mención Gestión de Personas">Ingeniería en Administración, mención Gestión de Personas</option>
                        <option value="Ingeniería en Administración, mención Innovación y Emprendimiento">Ingeniería en Administración, mención Innovación y Emprendimiento</option>
                        <option value="Ingeniería en Administración, mención Finanzas">Ingeniería en Administración, mención Finanzas</option>
                        <option value="Técnico en Administración">Técnico en Administración</option>
                        <option value="Relaciones Públicas y Comunicación Organizacional">Relaciones Públicas y Comunicación Organizacional</option>
                        <option value="Publicidad">Publicidad</option>
                    </select>
                </div>

                <!-- Selector de Ubicación -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Ubicación de la Práctica</label>
                    <p class="text-xs text-gray-500 mb-2">Haz clic en el mapa para marcar la ubicación exacta de tu empresa.</p>
                    
                    <!-- Campos ocultos para enviar a views.py -->
                    <input type="hidden" id="latitud" name="latitud" value="-33.4489">
                    <input type="hidden" id="longitud" name="longitud" value="-70.6693">
                    
                    <!-- Contenedor del mini mapa -->
                    <div id="mapa-crear" class="w-full h-64 rounded-lg border border-gray-300 z-10"></div>
                </div>

                <!-- Botón de Envío -->
                <div class="pt-4">
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-md">
                        Publicar Oferta
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Iniciar mapa en Santiago
        var map = L.map('mapa-crear').setView([-33.4489, -70.6693], 12);
        
        // Usar la capa de Esri (sin bloqueos)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS'
        }).addTo(map);

        // Pin inicial (que se puede mover)
        var marker = L.marker([-33.4489, -70.6693], {draggable: true}).addTo(map);

        // Actualizar coordenadas si el usuario arrastra el pin
        marker.on('dragend', function(e) {
            var latLng = marker.getLatLng();
            document.getElementById('latitud').value = latLng.lat;
            document.getElementById('longitud').value = latLng.lng;
        });

        // Actualizar coordenadas si el usuario hace clic en otro lado del mapa
        map.on('click', function(e) {
            marker.setLatLng(e.latlng);
            document.getElementById('latitud').value = e.latlng.lat;
            document.getElementById('longitud').value = e.latlng.lng;
        });
        
        // Asegurar que el mapa se renderice correctamente después de cargar la página
        setTimeout(function() {
            map.invalidateSize();
        }, 100);
    });
</script>
{% endblock %}
