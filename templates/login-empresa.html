{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Empresas - PrácticasPro</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-200">
    
    <!-- ENCABEZADO / BRANDING -->
    <div class="bg-blue-900 p-6 text-white text-center">
      <div class="flex justify-center items-center space-x-2 mb-2">
        <span class="text-2xl font-bold tracking-tight">Prácticas<span class="text-yellow-400">Pro</span></span>
      </div>
      <h2 class="text-xl font-bold text-blue-100">Portal Empresas</h2>
      <p class="text-xs text-blue-200 mt-1">Accede para gestionar vacantes y reclutar talento Duoc UC</p>
    </div>

    <!-- FORMULARIO DE LOGIN -->
    <form class="p-6 space-y-4">
      
      <!-- Campo Correo Corporativo -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Correo Corporativo</label>
        <input type="email" placeholder="contacto@empresa.com" required
          class="w-full p-3 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-900">
      </div>

      <!-- Campo Contraseña -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <input type="password" placeholder="••••••••" required
          class="w-full p-3 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-900">
      </div>

      <!-- Recordarme y Olvidó Clave -->
      <div class="flex items-center justify-between text-xs text-gray-600">
        <label class="flex items-center cursor-pointer">
          <input type="checkbox" class="mr-2 rounded text-blue-900 focus:ring-blue-900"> Recordarme
        </label>
        <a href="#" class="text-blue-900 font-medium hover:underline">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Botón Ingresar -->
      <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 rounded-lg transition shadow-md">
        Iniciar Sesión
      </button>

      <hr class="border-gray-200 my-4">

      <!-- BOTÓN / ENLACE CREAR CUENTA -->
      <div class="text-center space-y-3">
        <p class="text-xs text-gray-600">¿Tu empresa aún no publica vacantes en PrácticasPro?</p>
        <a href="{% url 'registro_empresa' %}" class="block w-full border-2 border-blue-900 text-blue-900 hover:bg-blue-50 font-semibold py-2.5 rounded-lg text-sm transition">
          Registrar Empresa
        </a>
      </div>

      <!-- Volver al Inicio -->
      <div class="text-center pt-2">
        <a href="{% url 'index' %}" class="text-xs text-gray-500 hover:text-gray-800 transition">← Volver al inicio</a>
      </div>

    </form>
  </div>

</body>
</html>
